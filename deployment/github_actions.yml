name: Mastermind Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall app.py backend experiments

      - name: Run API smoke test
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          assert client.get("/health").status_code == 200
          assert client.post("/new-game").status_code == 200
          assert client.post("/guess", json={"guess": [1, 2, 3, 4]}).status_code == 200
          assert client.get("/statistics").status_code == 200
          print("API smoke test passed")
          PY
