<!DOCTYPE html>
<html lang="en">
<head>

    <title>AI Solver Demo</title>

</head>

<body>

    <h1>AI Solver Demo</h1>

    <select id="solver">
        <option value="random">Random</option>

    <div id="output"></div>

    <br>
